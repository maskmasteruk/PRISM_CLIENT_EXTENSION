<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRISM</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
    <header class="topbar">
        <div class="brand-row">
            <div class="brand">
                <div class="logo" aria-hidden="true">
                    <img src="icons/icon32.png" alt="">
                </div>
                <div class="brand-copy">
                    <div class="title">PRISM</div>
                    <div class="subtitle">Privacy-preserving screen agent</div>
                </div>
            </div>
            <span class="trust-pill">Local-first</span>
        </div>

        <div class="tabs" role="tablist" aria-label="Popup sections">
            <button
                    class="tab active"
                    id="agentTab"
                    type="button"
                    role="tab"
                    aria-selected="true"
                    aria-controls="agentView"
            >
                Agent
            </button>
            <button
                    class="tab"
                    id="privateTab"
                    type="button"
                    role="tab"
                    aria-selected="false"
                    aria-controls="privateView"
            >
                Vault
            </button>
        </div>
    </header>

    <main class="view active" id="agentView" role="tabpanel" aria-labelledby="agentTab">
        <section class="chat-toolbar" aria-label="Agent controls">
            <strong class="agent-status" id="agentStatus">Idle</strong>
            <button class="secondary quiet" id="stopAgent" type="button" disabled>Stop</button>
            <button class="secondary quiet" id="clearChats" type="button">Clear Chats</button>
        </section>

        <section class="chat-shell" aria-label="Conversation">
            <div class="chat" id="chat" aria-live="polite"></div>
        </section>

        <section class="input-area" aria-label="Message composer">
            <div class="input-box">
                <label class="sr-only" for="messageInput">Ask PRISM</label>
                <textarea id="messageInput" rows="1" placeholder="Ask PRISM" autocomplete="off"></textarea>
                <button class="primary send-button" id="send" type="button" title="Send message">Send</button>
            </div>

            <div class="screenshot-option">
                <label class="screenshot-toggle">
                    <input type="checkbox" id="attachScreenshot">
                    <span class="toggle-slider" aria-hidden="true"></span>
                    <span class="toggle-label">Attach screenshot</span>
                </label>
            </div>
        </section>
    </main>

    <main class="view" id="privateView" role="tabpanel" aria-labelledby="privateTab" hidden>
        <section class="vault-header">
            <div>
                <h1>Local vault</h1>
                <p>Secrets are stored in browser storage and referenced by key.</p>
            </div>
            <span class="vault-count" id="secretCount">0 saved</span>
        </section>

        <section class="toolbar" aria-label="Secret controls">
            <label class="search-shell" for="secretSearch">
                <span class="search-icon" aria-hidden="true"></span>
                <input id="secretSearch" type="search" placeholder="Search keys">
            </label>
            <div class="toolbar-actions">
                <button class="primary" id="addSecret" type="button">Add Secret</button>
                <button class="secondary" id="exportSecrets" type="button">Export</button>
                <button class="secondary" id="importSecrets" type="button">Import</button>
            </div>
            <input class="hidden" id="importSecretsFile" type="file" accept="application/json,.json">
        </section>

        <section class="secret-list" id="secretList" aria-live="polite"></section>

        <form class="secret-form hidden" id="secretForm">
            <div class="form-header">
                <div>
                    <h2>Secret details</h2>
                    <p>Values are hidden in the list view.</p>
                </div>
            </div>

            <input type="hidden" id="secretId">
            <label>
                Key
                <input id="secretKey" required placeholder="email">
            </label>
            <label>
                Value
                <div class="secret-value-row">
                    <input id="secretValue" required type="password" autocomplete="off" placeholder="Stored locally">
                    <button class="secondary" id="toggleReveal" type="button">Reveal</button>
                </div>
            </label>
            <label>
                Category
                <select id="secretCategory"></select>
            </label>
            <label>
                Description
                <input id="secretDescription" placeholder="Optional">
            </label>
            <div class="form-actions">
                <button class="primary" id="saveSecret" type="submit">Save</button>
                <button class="secondary" id="cancelSecret" type="button">Cancel</button>
                <button id="deleteSecret" class="danger hidden" type="button">Delete</button>
            </div>
        </form>

        <button class="danger clear-button" id="clearSecrets" type="button">Clear All Secrets</button>
    </main>
</div>

<script type="module" src="popup.js"></script>
</body>
</html>
